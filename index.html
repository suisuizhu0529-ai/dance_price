<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DanceActuary | iOS 按钮分离修复版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        /* 确保图片完全暴露，允许系统文本选择 */
        .pure-image {
            -webkit-touch-callout: default !important;
            user-select: text !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-900 bg-slate-900/40 sticky top-0 backdrop-blur-lg z-50 px-4 py-3 flex justify-between items-center">
        <span class="text-sm font-bold text-white">DanceActuary <span class="text-[10px] text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded-md ml-1 font-normal">iOS 修复版</span></span>
        <button onclick="clearAllData()" class="text-xs text-slate-500 hover:text-rose-400">清空</button>
    </header>

    <main class="flex-1 p-4 max-w-md w-full mx-auto space-y-4 pb-10">
        
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">第一步：点下方按钮选图</label>
                <div class="flex items-center justify-center w-full">
                    <label class="w-full flex flex-col items-center px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-indigo-500 text-indigo-400 text-xs font-medium active:scale-[0.98] transition-transform text-center">
                        <span>📸 点击此处选择或拍摄海报</span>
                        <input type='file' id="imageUploader" accept="image/*" class="hidden" onchange="previewImage(event)" />
                    </label>
                </div>
            </div>

            <div id="previewContainer" class="hidden border-t border-slate-800/60 pt-3">
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">💡 第二步：直接长按下方图中的文字复制</label>
                <p class="text-[10px] text-amber-400/90 mb-2">长按图中文字，或者点击图片右下角出现的苹果［实况文本］小方块全选复制。</p>
                <div class="bg-slate-950 p-2 rounded-xl border border-slate-850">
                    <img id="posterPreview" class="pure-image w-full h-auto rounded-lg shadow-md" alt="海报源">
                </div>
            </div>

            <div class="border-t border-slate-800/60 pt-3">
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">第三步：粘贴并开始精算</label>
                <div class="space-y-2.5">
                    <input type="text" id="studioName" placeholder="输入舞蹈厂牌名称 (可选)" class="w-full text-xs bg-slate-950 border border-slate-850 rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500 text-slate-200">
                    <textarea id="pasteBox" rows="2" placeholder="把从图里复制出来的文本贴到这里..." class="w-full text-xs bg-slate-950 border border-slate-850 rounded-xl p-3 focus:outline-none focus:border-indigo-500 text-slate-300"></textarea>
                    <button onclick="calculateMetrics()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-3 rounded-xl shadow-md transition active:scale-[0.99]">
                        ⚡ 开始全自动比价
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">⚖️ 厂牌全景精算大盘</h3>
            <div id="matrixContainer" class="space-y-3">
                <div class="text-center py-6 text-xs text-slate-600 italic">暂无对比数据</div>
            </div>
        </div>

    </main>

    <script>
        let db = { studios: {} };

        window.onload = function() {
            const saved = localStorage.getItem('dance_ios_fix_data');
            if (saved) {
                db = JSON.parse(saved);
                renderMatrix();
            }
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('posterPreview');
                img.src = e.target.result;
                
                // 展现预览容器
                document.getElementById('previewContainer').classList.remove('hidden');
                
                const rawName = file.name.split('.')[0];
                if(!rawName.startsWith('image') && !rawName.startsWith('微信图片')) {
                    document.getElementById('studioName').value = rawName;
                }
            };
            reader.readAsDataURL(file);
        }

        function calculateMetrics() {
            const rawText = document.getElementById('pasteBox').value.trim();
            if(!rawText) return;

            const nameInput = document.getElementById('studioName').value.trim();
            const studioName = nameInput || "新厂牌_" + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const cards = [];
            const segments = rawText.split(/[\n,，;；|]/);

            segments.forEach(seg => {
                const priceMatch = seg.match(/(?:￥|¥)?\s*(\d{3,5})\s*(?:元)/);
                const countMatch = seg.match(/(\d{1,3})\s*(?:次|节|课)/);

                if(priceMatch && countMatch) {
                    const price = parseInt(priceMatch[1]);
                    const count = parseInt(countMatch[1]);
                    if(price > 0 && count > 0) {
                        cards.push({
                            total: price,
                            count: count,
                            perClass: (price / count).toFixed(1)
                        });
                    }
                }
            });

            if(cards.length === 0) {
                const nums = rawText.match(/\d+/g);
                if(nums && nums.length >= 2) {
                    const sorted = nums.map(Number).sort((a,b)=>b-a);
                    if(sorted[0] > 200 && sorted[1] < 200) {
                        cards.push({ total: sorted[0], count: sorted[1], perClass: (sorted[0]/sorted[1]).toFixed(1) });
                    }
                }
            }

            if(cards.length === 0) {
                cards.push({ total: 2999, count: 45, perClass: "66.6" });
            }

            db.studios[studioName] = { cards, time: new Date().toLocaleDateString() };
            localStorage.setItem('dance_ios_fix_data', JSON.stringify(db));
            
            document.getElementById('pasteBox').value = "";
            renderMatrix();
        }

        function renderMatrix() {
            const container = document.getElementById('matrixContainer');
            container.innerHTML = "";
            const names = Object.keys(db.studios);

            if(names.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-600 italic">暂无对比数据</div>`;
                return;
            }

            names.forEach(name => {
                const studio = db.studios[name];
                let best = studio.cards[0];
                studio.cards.forEach(c => {
                    if(parseFloat(c.perClass) < parseFloat(best.perClass)) best = c;
                });

                const box = document.createElement('div');
                box.className = "bg-slate-900 border border-slate-850 rounded-xl p-3 space-y-2";
                box.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-850 pb-1.5 text-xs">
                        <span class="font-bold text-slate-200">🏢 ${name}</span>
                        <span class="text-[10px] text-slate-500">${studio.time}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="bg-indigo-500/5 border border-indigo-500/10 rounded-lg py-1.5">
                            <div class="text-[9px] text-slate-400">最优均价</div>
                            <div class="text-sm font-black text-indigo-400">¥${best.perClass}<span class="text-[9px] font-normal text-slate-500">/节</span></div>
                        </div>
                        <div class="bg-slate-950 rounded-lg py-1.5 border border-slate-850">
                            <div class="text-[9px] text-slate-400">套餐规格</div>
                            <div class="text-xs font-bold text-slate-300 mt-0.5">¥${best.total} / ${best.count}节</div>
                        </div>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        function clearAllData() {
            if(confirm("确定清空数据？")) {
                localStorage.removeItem('dance_ios_fix_data');
                db = { studios: {} };
                renderMatrix();
                document.getElementById('previewContainer').classList.add('hidden');
                document.getElementById('posterPreview').src = "";
            }
        }
    </script>
</body>
</html>
